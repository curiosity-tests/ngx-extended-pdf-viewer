on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
name: Test Workflow
run-name: "Test Workflow ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
jobs:
  test:
    permissions:
      contents: read # To checkout repository
      actions: read # To read workflow artifacts (if needed)
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for SonarCloud blame data
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm' # Add caching for faster runs
      - name: Install dependencies
        run: npm ci --ignore-scripts && ./build-tools/search-for-shai-hulud.sh --full && npm rebuild esbuild
      - name: Run tests
        run: npm run test:ci
      - name: Check the SBOM pipeline
        run: npm run test:sbom
      - name: SonarCloud Scan
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
